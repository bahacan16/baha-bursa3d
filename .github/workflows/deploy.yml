name: Deploy to GitHub Pages

# Siteyi derleyip `gh-pages` dalına yayınlar (Settings → Pages → "Deploy from a branch: gh-pages").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Fetch OSM + terrain data
        # Başarısız olursa commit edilmiş public/data ile devam et (yoksa uygulama tarayıcıdan Overpass'a sorar).
        run: |
          if npm run fetch-data; then
            node scripts/fetch-terrain.mjs || echo "::warning::Arazi verisi alınamadı; commit edilmiş terrain.bin kullanılacak."
          else
            echo "::warning::OSM verisi alınamadı; commit edilmiş public/data kullanılacak."
          fi
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Publish to gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
