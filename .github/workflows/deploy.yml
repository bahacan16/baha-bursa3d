name: Deploy to GitHub Pages

# Siteyi derleyip `gh-pages` dalına yayınlar (Settings → Pages → "Deploy from a branch: gh-pages").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # KARAR: veri yayında yeniden indirilmez; repodaki public/data kullanılır (fetch-data.yml ayrıca günceller).
      # Overpass yavaşken yayın dakikalarca bekliyordu ve taze veri el modelleriyle/bake'lerle tutarsız olabilirdi.
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Publish to gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
