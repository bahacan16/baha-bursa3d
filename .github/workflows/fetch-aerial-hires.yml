name: Fetch high-res aerial (survey)

# Site içi ölçümü için yüksek çözünürlüklü hava fotoğrafları → streetview-src/aerial (yayınlanmaz)
on:
  workflow_dispatch:
    inputs:
      tiles:
        description: 'Paftalar (virgüllü): w,e,n1,n2 — boşsa yalnız yeni paftalar (n1,n2)'
        default: 'n1,n2'
  push:
    paths:
      - 'scripts/fetch-aerial-hires.mjs'
      - '.github/workflows/fetch-aerial-hires.yml'

permissions:
  contents: write

concurrency:
  group: fetch-aerial-hires-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Hava fotoğrafları
        if: contains(format(',{0},', inputs.tiles || 'n1,n2'), ',w,')
        env:
          AERIAL_SOURCES: google
          # Mertkent + Doğan Avcıoğlu doğu koridoru + Uğur Mumcu (x −160…340, z −390…110)
          AERIAL_CX: 90
          AERIAL_CZ: -140
          AERIAL_HALF: 250
        run: node --experimental-strip-types scripts/fetch-aerial-hires.mjs
      - name: Hava fotoğrafları (doğu paftası — Doğan Avcıoğlu → Özlüce kavşağı)
        if: contains(format(',{0},', inputs.tiles || 'n1,n2'), ',e,')
        env:
          AERIAL_SOURCES: google
          AERIAL_DIR: aerial-e
          # x 230…730, z −350…150
          AERIAL_CX: 480
          AERIAL_CZ: -100
          AERIAL_HALF: 250
        run: node --experimental-strip-types scripts/fetch-aerial-hires.mjs
      # KARAR (2026-09-29): Özlüce Bulvarı kuzey koridoru → Muammer Aksoy Cd. kavşağı (z ≈ −805). Mevcut w/e paftaları
      # yeniden indirilmez (ölçümler onlara göre; görüntü güncellenirse eski ölçümlerle çelişirdi).
      - name: Hava fotoğrafları (kuzey paftası 1 — Özlüce Bulvarı, kavşaktan kuzeye)
        if: contains(format(',{0},', inputs.tiles || 'n1,n2'), ',n1,')
        env:
          AERIAL_SOURCES: google
          AERIAL_DIR: aerial-n1
          # x 390…890, z −580…−80
          AERIAL_CX: 640
          AERIAL_CZ: -330
          AERIAL_HALF: 250
        run: node --experimental-strip-types scripts/fetch-aerial-hires.mjs
      - name: Hava fotoğrafları (kuzey paftası 2 — Muammer Aksoy Cd. kavşağına kadar)
        if: contains(format(',{0},', inputs.tiles || 'n1,n2'), ',n2,')
        env:
          AERIAL_SOURCES: google
          AERIAL_DIR: aerial-n2
          # x 390…890, z −950…−450
          AERIAL_CX: 640
          AERIAL_CZ: -700
          AERIAL_HALF: 250
        run: node --experimental-strip-types scripts/fetch-aerial-hires.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A streetview-src
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "data: high-res aerial survey images"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
