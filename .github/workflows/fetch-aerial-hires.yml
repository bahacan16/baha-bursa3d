name: Fetch high-res aerial (survey)

# Site içi ölçümü için yüksek çözünürlüklü hava fotoğrafları → streetview-src/aerial (yayınlanmaz)
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-aerial-hires.mjs'
      - '.github/workflows/fetch-aerial-hires.yml'

permissions:
  contents: write

concurrency:
  group: fetch-aerial-hires-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Hava fotoğrafları
        env:
          AERIAL_SOURCES: google
          # Mertkent + Doğan Avcıoğlu doğu koridoru (x −160…240, z −330…70)
          AERIAL_CX: 40
          AERIAL_CZ: -130
          AERIAL_HALF: 200
        run: node --experimental-strip-types scripts/fetch-aerial-hires.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streetview-src/aerial
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "data: high-res aerial survey images"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
